name: Setup workspace
description: Install pnpm, Node and workspace dependencies
runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@v6
    - uses: actions/setup-node@v7
      with:
        node-version-file: .nvmrc
        cache: pnpm
    - run: pnpm install --frozen-lockfile
      shell: bash
      env:
        LEFTHOOK: "0"
